# The qxcbuild.yml file defines one target for each OS/architecture pair.
# Outputs use exact paths and select a target and root modules.

targets:
  linux-x64:
    platform: linux
    cpu: x64
    backend: llvm
    modules:
      syscall:
        source: syscall
      posix:
        source: posix
      RUNTIME:
        source: runtime
      std:
        source: std
      foolib:
        source: foolib1_0
      barlib:
        source: barlib2_1
      helloworld:
        source: helloworld_main
      stepping_demo:
        source: stepping_demo_main
      integer_blur:
        source: integer_blur_main
      argv_case:
        source: argv_case_main
      tests:
        options:
          option_num: 5
        source: tests
  linux-x64-glibc:
    platform: linux
    cpu: x64
    environment: glibc
    backend: llvm
    modules:
      syscall:
        source: syscall
      posix:
        source: posix
      RUNTIME:
        source: runtime
      std:
        source: std
      foolib:
        source: foolib1_0
      barlib:
        source: barlib2_1
      tests:
        options:
          option_num: 5
        source: tests
  linux-arm64:
    platform: linux
    cpu: ARM64
    backend: llvm
    modules:
      syscall:
        source: syscall
      posix:
        source: posix
      RUNTIME:
        source: runtime
      std:
        source: std
      foolib:
        source: foolib1_0
      barlib:
        source: barlib2_1
      helloworld:
        source: helloworld_main
      tests:
        options:
          option_num: 5
        source: tests
  linux-x86:
    platform: linux
    cpu: x86
    backend: llvm
    modules:
      syscall:
        source: syscall
      posix:
        source: posix
      RUNTIME:
        source: runtime
      std:
        source: std
      foolib:
        source: foolib1_0
      barlib:
        source: barlib2_0
      tests:
        options:
          option_num: 5
        source: tests
  linux-z-arch:
    platform: linux
    cpu: z_arch
    backend: llvm
    modules:
      syscall:
        source: syscall
      posix:
        source: posix
      RUNTIME:
        source: runtime
      std:
        source: std
      foolib:
        source: foolib1_0
      barlib:
        source: barlib2_1
      tests:
        options:
          option_num: 5
        source: tests
  windows-x64:
    platform: windows
    cpu: x64
    backend: llvm
    steppings:
      - attributes:
          - X64_FEATURES_V1
      - attributes:
          - X64_FEATURES_V2
      - attributes:
          - X64_FEATURES_V3
      - attributes:
          X64_VENDOR_AMD: true
          X64_FEATURES_V3: true
          X64_FEATURE_ADX: true
          X64_FEATURE_AES: true
          X64_FEATURE_CLFLUSHOPT: true
          X64_FEATURE_CLZERO: true
          X64_FEATURE_CRC32: true
          X64_FEATURE_FSGSBASE: true
          X64_FEATURE_MWAITX: true
          X64_FEATURE_PCLMULQDQ: true
          X64_FEATURE_PREFETCHW: true
          X64_FEATURE_RDRAND: true
          X64_FEATURE_RDSEED: true
          X64_FEATURE_SHA: true
          X64_FEATURE_SSE4A: true
          X64_FEATURE_XSAVEC: true
          X64_FEATURE_XSAVEOPT: true
          X64_FEATURE_XSAVES: true
        tune: X64_TUNE_AMD_ZEN1
      - attributes:
          - X64_FEATURES_V4
    modules:
      syscall:
        source: syscall
      posix:
        source: posix
      RUNTIME:
        source: runtime
      std:
        source: std
      foolib:
        source: foolib1_0
      barlib:
        source: barlib2_1
      stepping_demo:
        source: stepping_demo_main
      tests:
        options:
          option_num: 5
        source: tests
  macos-arm64:
    platform: macos
    cpu: ARM64
    backend: llvm
    modules:
      syscall:
        source: syscall
      posix:
        source: posix
      RUNTIME:
        source: runtime
      std:
        source: std
      foolib:
        source: foolib1_0
      barlib:
        source: barlib2_1
      stepping_demo:
        source: stepping_demo_main
      integer_blur:
        source: integer_blur_main
      tests:
        options:
          option_num: 5
        source: tests
  jvm-jvm:
    platform: jvm
    run_static_tests: false
    modules:
      syscall:
        source: syscall
      posix:
        source: posix
      RUNTIME:
        source: runtime
      std:
        source: std
      foolib:
        source: foolib1_0
      barlib:
        source: barlib2_1
      integer_blur:
        source: integer_blur_main
      argv_case:
        source: argv_case_main
      tests:
        options:
          option_num: 5
        source: tests
      jvm_interop:
        source: jvm_interop
      jvm_failure:
        source: jvm_failure

outputs:
  linux-x64/helloworld:
    target: linux-x64
    type: executable
    main_module: helloworld
    backend_llvm_options:
      build_type: Release

  linux-x64/tests:
    target: linux-x64
    type: unit_test_suite
    build_type: quick
    test_modules: [syscall, posix, RUNTIME, std, foolib, barlib, tests]

  linux-x64-glibc/tests:
    target: linux-x64-glibc
    type: unit_test_suite
    build_type: quick
    test_modules: [syscall, posix, RUNTIME, std, foolib, barlib, tests]

  linux-arm64/helloworld:
    target: linux-arm64
    type: executable
    main_module: helloworld
    build_type: quick
  linux-arm64/helloworld.dbg:
    target: linux-arm64
    type: executable
    main_module: helloworld
    backend_llvm_options:
      build_type: Debug
  linux-arm64/tests:
    target: linux-arm64
    type: unit_test_suite
    build_type: quick
    test_modules: [syscall, posix, RUNTIME, std, foolib, barlib, tests]

  linux-x86/tests:
    target: linux-x86
    type: unit_test_suite
    build_type: quick
    test_modules: [syscall, posix, RUNTIME, std, foolib, barlib, tests]
  linux-x86/thread-smoke:
    target: linux-x86
    type: executable
    main_module: tests
    main_functanoid: "::thread_static_target_smoke_main#()"

  linux-z-arch/tests:
    target: linux-z-arch
    type: unit_test_suite
    test_modules: [syscall, posix, RUNTIME, std, foolib, barlib, tests]

  windows-x64/stepping-demo.exe:
    target: windows-x64
    type: executable
    main_module: stepping_demo
    backend_llvm_options:
      build_type: Release
  windows-x64/tests.exe:
    target: windows-x64
    type: unit_test_suite
    test_modules: [syscall, posix, RUNTIME, std, foolib, barlib, tests]

  macos-arm64/stepping-demo:
    target: macos-arm64
    type: executable
    main_module: stepping_demo
    backend_llvm_options:
      build_type: Release
  macos-arm64/integer-blur:
    target: macos-arm64
    type: executable
    main_module: integer_blur
    backend_llvm_options:
      build_type: Release
  macos-arm64/tests:
    target: macos-arm64
    type: unit_test_suite
    test_modules: [RUNTIME, tests]


  jvm-jvm/tests.jar:
    target: jvm-jvm
    type: unit_test_suite
    test_modules: [RUNTIME, tests]
