# The qxcbuild.yml file defines one target for each OS/architecture pair.
# Each target may produce multiple output binaries from different root modules.

linux-x64:
  platform: linux
  cpu: x64
  backend: llvm
  steppings:
    - attributes:
        - X64_FEATURES_V1
    - attributes:
        - X64_FEATURES_V2
    - attributes:
        - X64_FEATURES_V3
    - attributes:
        - X64_FEATURES_V4
  modules:
    syscall:
      source: syscall
    RUNTIME:
      source: runtime
    std:
      source: std
    foolib:
      source: foolib1_0
    barlib:
      source: barlib2_1
    helloworld:
      source: helloworld_main
    stepping_demo:
      source: stepping_demo_main
    integer_blur:
      source: integer_blur_main
    argv_case:
      source: argv_case_main
    tests:
      options:
        option_num: 5
      source: tests
  outputs:
    helloworld:
      type: executable
      main_module: helloworld
      backend_llvm_options:
        mode: optimize

    tests:
      type: unit_test_suite
      test_modules: [syscall, RUNTIME, std, foolib, barlib, tests]

