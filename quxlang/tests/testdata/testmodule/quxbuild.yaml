tests-linux-x64:
  platform: linux
  cpu: x64
  modules:
    syscall:
      source: syscall
    RUNTIME:
      source: runtime
    std:
      source: std
    filesystem:
      source: filesystem
    foolib:
      source: foolib1_0
    barlib:
      source: barlib2_1
    tests:
      options:
        option_num: 5
      source: tests
  steppings:
    - attributes: []
    - attributes:
        - X64_FEATURE_SSE2
    - attributes:
        - X64_FEATURE_SSE2
        - X64_FEATURE_AVX
    - attributes:
        - X64_FEATURE_SSE2
        - X64_FEATURE_AVX
        - X64_FEATURE_AVX2
    - attributes:
        - X64_FEATURE_SSE2
        - X64_FEATURE_AVX
        - X64_FEATURE_AVX2
        - X64_FEATURE_AVX512F
  outputs:
    default:
      type: executable
      module: tests
    tests:
      type: unit_test_suite
      module: tests
    fusion-native-explicit-panic:
      type: executable
      module: tests
      main_functanoid: "::fusion_native_explicit_panic_main#()"
    fusion-native-match-default-fail:
      type: executable
      module: tests
      main_functanoid: "::fusion_native_match_default_fail_main#()"
    fusion-native-match-valueless:
      type: executable
      module: tests
      main_functanoid: "::fusion_native_match_valueless_main#()"
    fusion-native-unwrap-wrong-alternative:
      type: executable
      module: tests
      main_functanoid: "::fusion_native_unwrap_wrong_alternative_main#()"
    fusion-native-unwrap-valueless:
      type: executable
      module: tests
      main_functanoid: "::fusion_native_unwrap_valueless_main#()"

