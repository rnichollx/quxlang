# The quxbuild.yaml file defines 1 or more top level targets.
# Each target must define a list of modules, a platform, and a cpu type.

helloworld-linux-x64:
  platform: linux
  cpu: x64
  backend: llvm
  modules:
    syscall:
      source: syscall
    RUNTIME:
      source: runtime
    std:
      source: std
    main:
      source: helloworld_main
  outputs:
    app:
      type: executable
      backend_llvm_options:
        mode: optimize
    app.dbg:
      type: executable
      backend_llvm_options:
        mode: debug

stepping-demo-linux-x64:
  platform: linux
  cpu: x64
  backend: llvm
  steppings:
    - attributes:
        - X64_FEATURES_V1
    - attributes:
        - X64_FEATURES_V2
    - attributes:
        - X64_FEATURES_V3
    # x64-ryzen: the V3 baseline plus Zen 1's additional legal instructions.
    - attributes:
        X64_VENDOR_AMD: true
        X64_FEATURES_V3: true
        X64_FEATURE_ADX: true
        X64_FEATURE_AES: true
        X64_FEATURE_CLFLUSHOPT: true
        X64_FEATURE_CLZERO: true
        X64_FEATURE_CRC32: true
        X64_FEATURE_FSGSBASE: true
        X64_FEATURE_MWAITX: true
        X64_FEATURE_PCLMULQDQ: true
        X64_FEATURE_PREFETCHW: true
        X64_FEATURE_RDRAND: true
        X64_FEATURE_RDSEED: true
        X64_FEATURE_SHA: true
        X64_FEATURE_SSE4A: true
        X64_FEATURE_XSAVEC: true
        X64_FEATURE_XSAVEOPT: true
        X64_FEATURE_XSAVES: true
      tune: X64_TUNE_AMD_ZEN1
    - attributes:
        - X64_FEATURES_V4
  modules:
    syscall:
      source: syscall
    RUNTIME:
      source: runtime
      options:
        print_selected_stepping: true
    std:
      source: std
    main:
      source: stepping_demo_main
  outputs:
    app:
      type: executable
      backend_llvm_options:
        mode: optimize

