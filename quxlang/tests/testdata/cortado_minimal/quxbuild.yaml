jvm-cortado:
  platform: jvm
  modules:
    main:
      source: main
  outputs:
    app:
      type: executable
    app-asan:
      type: executable
      main_functanoid: "::double_deallocation_main#()"
      backend_cortado_options:
        mode: address_sanitizer
    app-asan-use-after-deallocation:
      type: executable
      main_functanoid: "::use_after_deallocation_main#()"
      backend_cortado_options:
        mode: address_sanitizer
    app-asan-valid-access:
      type: executable
      main_functanoid: "::valid_managed_access_main#()"
      backend_cortado_options:
        mode: address_sanitizer
    app-pointers:
      type: executable
      main_functanoid: "::pointer_comparison_main#()"
    app-null-pointer:
      type: executable
      main_functanoid: "::null_pointer_main#()"
    app-aggregate:
      type: executable
      main_functanoid: "::aggregate_main#()"
    app-string:
      type: executable
      main_functanoid: "::string_main#()"
    app-java-interop:
      type: executable
      main_functanoid: "::java_interop_main#()"
    app-unusual-integers:
      type: executable
      main_functanoid: "::unusual_integer_main#()"
    app-floating-point:
      type: executable
      main_functanoid: "::floating_point_main#()"
    app-global-closure:
      type: executable
      main_functanoid: "::global_closure_main#()"
    app-static-snapshot:
      type: executable
      main_functanoid: "::static_snapshot_main#()"
    tests:
      type: unit_test_suite
      module: main

jvm-cortado-target-asan:
  cpu: jvm
  backend_cortado_options:
    mode: address_sanitizer
  modules:
    main:
      source: main
  outputs:
    inherited:
      type: executable
