# run.py assembles this bundle with the checked-in standard library and runtime.
targets:
  native:
    platform: macos
    cpu: ARM64
    backend: llvm
    steppings: [{attributes: []}]
    modules:
      syscall: {source: syscall}
      posix: {source: posix}
      RUNTIME: {source: runtime}
      std: {source: std}
      main: {source: main}
outputs:
  allocations:
    target: native
    type: benchmark_executable
    build_type: Release
    benchmark: "::allocations"
