# run.py assembles this bundle from the checked-in runtime and standard library.
targets:
  native:
    platform: macos
    cpu: ARM64
    backend: llvm
    modules:
      syscall: {source: syscall}
      posix: {source: posix}
      RUNTIME: {source: runtime}
      std: {source: std}
      io: {source: io}
      main: {source: main}
outputs:
  algorithms:
    target: native
    type: benchmark_executable
    build_type: Release
    benchmark: "::algorithms"
