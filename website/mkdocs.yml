site_name: Quxlang
site_description: Comprehensive language documentation for Quxlang.
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started:
      - Overview: guide/index.md
      - First Program: guide/first-program.md
      - Source Bundles and Targets: guide/source-bundles.md
  - Syntax at a Glance: syntax-examples.md
  - Language Reference:
      - Feature Index: language/index.md
      - Fundamentals:
          - Lexical Structure: language/lexical-structure.md
          - Source Files and Imports: language/source-files-and-imports.md
          - Names, Namespaces, and Scopes: language/names-namespaces-and-scopes.md
          - Declaration Documentation: language/declaration-documentation.md
          - Variables and Storage: language/variables-and-storage.md
          - Static Objects and Materialization: language/static-objects-and-materialization.md
          - Primitive Types and Literals: language/primitive-types-and-literals.md
          - Arrays and Construction: language/arrays-and-construction.md
          - References and Pointers: language/references-and-pointers.md
          - Type Queries and Deduction: language/type-queries-and-deduction.md
      - Functions and Generic Code:
          - Functions and Parameters: language/functions-and-parameters.md
          - Call Arguments: language/call-arguments.md
          - Overloads and Enablement: language/overloads-and-enablement.md
          - Procedure Pointers and Function Values: language/procedure-pointers-and-function-values.md
          - Templates and Value Parameters: language/templates-and-value-parameters.md
          - Variadic Packs: language/variadic-packs.md
          - Lambdas: language/lambdas.md
      - Expressions:
          - Operator Precedence: language/operator-precedence.md
          - Assignment, Movement, and Swap: language/assignment-movement-and-swap.md
          - Arithmetic and Comparisons: language/arithmetic-and-comparisons.md
          - Floating-Point Ordering: language/floating-point-ordering.md
          - Logical and Booliation: language/logical-and-booliation.md
          - Bitwise Operators and BIT: language/bitwise-operators.md
          - Conversions: language/conversions.md
      - Control Flow:
