site_name: Quxlang.dev
site_description: Comprehensive language documentation for Quxlang.
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  logo: assets/quxlang-q-green.svg
  favicon: assets/quxlang-q-green.svg
  features:
    - navigation.sections
    - navigation.tabs

plugins:
  - search

extra:
  generator: false

extra_css:
  - stylesheets/theme.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

