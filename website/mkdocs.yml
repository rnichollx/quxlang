          - Constructors and Destructors: language/constructors-and-destructors.md
          - User-Defined Operators: language/user-defined-operators.md
          - Typed Storage and Lifetime: language/typed-storage-and-lifetime.md
          - Compile-Time Allocation: language/constexpr-allocation.md
          - Allocation Regions: language/allocation-regions.md
          - Addresses and Provenance: language/address-provenance.md
          - NEW and DELETE: language/new-and-delete.md
          - Enums: language/enums.md
          - Flagsets: language/flagsets.md
          - Unions and Variants: language/unions-and-variants.md
          - MATCH: language/match.md
      - Abstraction and Configuration:
          - Interfaces and Implementations: language/interfaces-and-implementations.md
          - Generics: language/generics.md
          - Availability and Targets: language/availability-and-targets.md
          - Privacy: language/privacy.md
          - Build Options: language/build-options.md
